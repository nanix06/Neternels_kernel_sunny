name: clang-NetErnels-KSUNext-susfs-clang

on:
  workflow_dispatch:
    inputs:
      clang_version:
        description: "Version de clang/LLVM (ex: 21, 22, 23)"
        required: true
        default: "23"

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: neternels_defconfig
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
  CLANG_VER: ${{ inputs.clang_version || '23' }}
  MAKE_ARGS: >-
    CC=clang
    HOSTCC=clang
    HOSTCXX=clang++
    LD=ld.lld
    HOSTLD=ld.lld
    AR=llvm-ar
    NM=llvm-nm
    OBJCOPY=llvm-objcopy
    OBJDUMP=llvm-objdump
    READELF=llvm-readelf
    STRIP=llvm-strip
    CLANG_TRIPLE=aarch64-linux-gnu-
    CROSS_COMPILE=aarch64-linux-gnu-
    CROSS_COMPILE_ARM32=arm-linux-gnueabi-
    CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
    LLVM_IAS=1

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Télécharger le source
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1
          submodules: recursive

      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex git libssl-dev \
            libelf-dev pahole python3 rsync unzip wget zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            lsb-release software-properties-common gnupg

      - name: Installer Clang (apt.llvm.org)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$CLANG_VER" all
          sudo apt-get install -y "lld-$CLANG_VER" "llvm-$CLANG_VER"
          rm -f llvm.sh

          # Liens sans suffixe : le Makefile du kernel appelle "llvm-ar", "ld.lld"... en dur
          for t in clang clang++ clang-cpp ld.lld lld llvm-ar llvm-nm llvm-objcopy \
                   llvm-objdump llvm-readelf llvm-strip llvm-ranlib llvm-as llvm-size; do
            [ -x "/usr/lib/llvm-$CLANG_VER/bin/$t" ] && \
              sudo ln -sf "/usr/lib/llvm-$CLANG_VER/bin/$t" "/usr/local/bin/$t"
          done
          clang --version
          ld.lld --version
          # Pas de tube avec head/grep -q : ils ferment le tube trop tôt et LLVM
          # plante avec "IO failure on output stream: Broken pipe" (pipefail).
          llvm-ar --version > /tmp/llvm-ar-version.txt
          head -n1 /tmp/llvm-ar-version.txt
          clang --version > /tmp/clang-version.txt
          grep -q "version $CLANG_VER\." /tmp/clang-version.txt \
            || { echo "Mauvaise version de clang (attendu: $CLANG_VER)"; exit 1; }

      - name: Télécharger et appliquer les patchs KernelSU et SuSFS
        run: |
          git clone --depth=1 -b main https://github.com/nanix06/Patch_Ksu_SuSFS.git patches
          patch -p1 --fuzz=3 < patches/Patches/SU_kernel/patch_ksunext.patch || true
          patch -p1 --fuzz=3 < patches/Patches/SuSFS_Kernel/50_add_susfs_in_kernel-4.14.patch || true
          # susfs_fix_nameic.patch ne s'applique pas sur cet arbre (Hunk #1 FAILED
          # at 3655) : sans conséquence ici, tout son code est sous
          # #ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT, option désactivée plus bas.
          patch -p1 --fuzz=3 < patches/Patches/Fix/susfs_fix_nameic.patch || true
          patch -p1 --fuzz=3 < patches/Patches/Fix/susfs_fix_statc.patch || true
          patch -p1 --fuzz=3 < patches/Patches/SuSFS_Kernel/55_try_umount_for_susfs.patch || true
          patch -p1 --fuzz=3 < patches/Patches/SU_kernel/patch_ksu_path_umount.patch || true
          sed -i 's/inotify_mark_user_mask(mark)/(mark->mask \& IN_ALL_EVENTS)/g' fs/notify/fdinfo.c
          sed -i '/^orig_flow:$/a\\t\t;' fs/notify/fdinfo.c
          sed -i '0,/^static void susfs_run_sus_path_loop(void) {/s//void susfs_run_sus_path_loop(void) {/' fs/susfs.c

      - name: "Supprimer les « LLVM ERROR: IO failure on output stream: Broken pipe »"
        run: |
          # scripts/Makefile.build decide s'il faut calculer les CRC de symboles
          # (CONFIG_MODVERSIONS=y dans neternels_defconfig, donc pour *chaque*
          # objet qui exporte des symboles) avec :
          #
          #     if $(OBJDUMP) -h .tmp_xxx.o | grep -q __ksymtab; then ...
          #
          # Avec OBJDUMP=llvm-objdump, `grep -q` quitte dès la première
          # correspondance et ferme le tube ; llvm-objdump continue d'écrire,
          # reçoit EPIPE et affiche :
          #
          #     LLVM ERROR: IO failure on output stream: Broken pipe
          #
          # C'est bénin (le test de grep reste juste, le build continue) mais ça
          # polluait le log avec 327 lignes dans le dernier run. Sans -q, grep
          # lit toute l'entrée : même résultat, plus de tube fermé trop tôt.
          #
          # 4 occurrences : cmd_modversions_c (dont une variante LLVM_NM),
          # cmd_modversions_S.
          sed -i 's/| grep -q __ksymtab/| grep __ksymtab >\/dev\/null/g' scripts/Makefile.build

          if grep -q 'grep -q __ksymtab' scripts/Makefile.build; then
            echo "ERREUR: sed non appliqué sur scripts/Makefile.build" >&2
            exit 1
          fi
          grep -n '__ksymtab' scripts/Makefile.build

      - name: Corriger l'injection initrc (hooks newfstat/fstat64 manquants)
        run: |
          # Patch fourni par le repo Patch_Ksu_SuSFS (clone dans patches/).
          #
          # Le patch kernelSU (nanix06) hooke newfstatat/fstatat64 -> ksu_handle_stat,
          # mais oublie newfstat -> ksu_handle_newfstat_ret et fstat64 -> ksu_handle_fstat64_ret.
          # Sans eux, init ne voit pas la taille reelle + accolee de init.rc, donc
          # KERNEL_SU_RC / modules.rc ne sont jamais lus, ksud post-fs-data n'est jamais
          # lance et les modules ne montent pas au boot.
          FIX=patches/Patches/Fix/patch_ksu_initrc_newfstat.patch
          test -f "$FIX" || {
            echo "ERREUR: $FIX absent (repo Patch_Ksu_SuSFS incomplet)"
            exit 1
          }
          # git apply (et non GNU patch) : le hunk fstat64 a 7 lignes de contexte avant
          # et 2 apres, GNU patch le considere alors "ancre en fin de fichier" et le
          # rejette ("Hunk #2 FAILED at 523"). git apply l'accepte avec le meme offset.
          git apply --verbose "$FIX"

          grep -q 'ksu_handle_newfstat_ret' fs/stat.c
          grep -q 'ksu_handle_fstat64_ret' fs/stat.c
          echo "OK: hooks newfstat/fstat64 presents dans fs/stat.c"

      - name: Ajouter KernelSU-Next
        run: |
          git clone --depth=1 -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          ln -s ../KernelSU/kernel drivers/kernelsu
          sed -i 's/get_monotonic_boottime(&ts)/get_monotonic_boottime64(\&ts)/' KernelSU/kernel/sulog/event.c
          sed -i '/#include <linux\/uaccess.h>/a #include <linux/timekeeping.h>' KernelSU/kernel/sulog/event.c

          # Spécifique à neth : correction selinux_kernel_status_page (non fatal si absent)
          sed -i 's/selinux_kernel_status_page()/selinux_kernel_status_page(\&selinux_state)/' KernelSU/kernel/feature/selinux_hide.c || true
          grep -n selinux_kernel_status_page KernelSU/kernel/feature/selinux_hide.c || true

          # ------------------------------------------------------------------
          # sepolicy.c : on GARDE celui de la branche legacy (pas de remplacement
          # par backslashxx/KernelSU, pas de #define KSU_TYPE_VAL_TO_STRUCT).
          #
          # Le workflow précédent installait le sepolicy.c de
          # backslashxx/KernelSU puis forçait `#define KSU_TYPE_VAL_TO_STRUCT`.
          # Cette macro signifie « mon policydb est moderne (>= 5.4) ». Or ici
          # security/selinux/ss/policydb.h (4.14.206, LA.UM.9.1) contient :
          #   struct flex_array *type_val_to_struct_array;
          #   struct flex_array *type_attr_map_array;
          #   struct flex_array *sym_val_to_name[SYM_NUM];
          # Donc le policydb est encore en flex_array et la macro faisait
          # compiler une API inexistante -> les 13 erreurs du run précédent :
          #   sepolicy.c:790: error: no member named 'type_val_to_struct'
          #                    in 'struct policydb'
          #   sepolicy.c:173: error: returning 'struct flex_array' from a
          #                    function with incompatible result type
          #                    'struct avtab_node *'
          #
          # Ce bricolage venait d'un noyau au policydb « post-flex_array »
          # (d'où KSU_TYPE_VAL_TO_STRUCT / KSU_TYPE_VAL_TO_STRUCT_ARRAY dans
          # backslashxx/KernelSU). Ce n'est pas le cas de sunny.
          #
          # Autre raison de garder le fichier de legacy : en dessous de 5.10,
          # rules.c applique les règles SELinux directement sur le policydb
          # vivant, sous write_lock() ou stop_machine() (contexte atomique) et
          # exige donc des allocations GFP_ATOMIC. Le sepolicy.c de legacy fait
          # ça ; celui de backslashxx utilise GFP_KERNEL partout (son rules.c
          # travaille sur une copie du policydb, chemin >= 5.10) -> risque de
          # « sleeping function called from invalid context » au boot.
          #
          # legacy définit aussi ksu_policydb_fixup_len(), appelé par rules.c,
          # qu'il fallait auparavant recoller à la main en stub vide.
          # ------------------------------------------------------------------
          if ! grep -q 'struct flex_array \*type_val_to_struct_array' security/selinux/ss/policydb.h; then
            echo "ERREUR: policydb.h n'utilise plus flex_array." >&2
            echo "Le sepolicy.c de la branche legacy n'est plus adapté : revoir ce bloc." >&2
            exit 1
          fi
          test -f KernelSU/kernel/selinux/sepolicy.c
          grep -q '^int ksu_policydb_fixup_len' KernelSU/kernel/selinux/sepolicy.c
          grep -q 'flex_array_alloc' KernelSU/kernel/selinux/sepolicy.c
          echo "OK: sepolicy.c legacy conservé (policydb flex_array + GFP_ATOMIC)"

          cp patches/Patches/SuSFS_Ksu/susfs_patch_ksunext.patch KernelSU/
          cd KernelSU
          patch -p1 < susfs_patch_ksunext.patch || true
          find . -name '*.rej' > /tmp/ksu-rej.txt
          if [ -s /tmp/ksu-rej.txt ]; then
            echo "ERREUR: hunks rejetés par susfs_patch_ksunext.patch :" >&2
            xargs -r cat < /tmp/ksu-rej.txt >&2
            exit 1
          fi
          cd ..

      - name: Configurer le noyau
        run: |
          mkdir -p out

          make O=out ARCH=arm64 \
            $MAKE_ARGS \
            "$DEFCONFIG"

          # KernelSU
          ./scripts/config --file out/.config --enable KSU
          ./scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL

          # SUSFS (SUS_MOUNT désactivé comme dans wc : compatibilité magic mount / modules)
          ./scripts/config --file out/.config --enable KSU_SUSFS
          ./scripts/config --file out/.config --enable KSU_SUSFS_HAS_MAGIC_MOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config --disable KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_OVERLAYFS
          ./scripts/config --file out/.config --enable KSU_SUSFS_TRY_UMOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SPOOF_UNAME_RELEASE
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_MAP
          ./scripts/config --file out/.config --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG

          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-NetErnels"
          ./scripts/config --file out/.config --disable CONFIG_LOCALVERSION_AUTO

          # Evite le build cassé du compat vDSO avec LLVM
          ./scripts/config --file out/.config --disable CONFIG_COMPAT_VDSO

          make O=out ARCH=arm64 \
            $MAKE_ARGS \
            olddefconfig

          # Contrôle final : KernelSU et SUSFS doivent bien être =y dans la config générée
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config

      - name: Compiler le noyau
        run: |
          # KCFLAGS est ajouté en dernier (Makefile:1043 « KBUILD_CFLAGS +=
          # $(ARCH_CFLAGS) $(KCFLAGS) »), donc ces options écrasent celles du
          # noyau ajoutées plus haut (Makefile:1006-1018).
          #
          # -Wno-incompatible-pointer-types
          #   Clang >= 15 en fait une erreur par défaut ; un noyau 4.14 en
          #   contient forcément quelques-unes.
          #
          # -Wno-error=strict-prototypes
          #   Le noyau 4.14 fait « -Werror=strict-prototypes » (Makefile:1009).
          #   Les sources CAF/vendor déclarent des fonctions sans prototype
          #   (ex. drivers/misc/wl2866d.c:86 « int f() » au lieu de
          #   « int f(void) ») : clang 23 refuse. On dégrade en simple
          #   avertissement au lieu de le supprimer, pour garder l'info dans
          #   les logs sans casser le build à chaque fichier vendor.
          #   (Correction à la source possible : ajouter « void » entre les
          #   parenthèses.)
          #
          # -Wno-implicit-enum-enum-cast
          #   Nouveau diagnostic « erreur par défaut » de clang sur les
          #   conversions entre enums différents en C. qcacld en est truffé :
          #   drivers/staging/qcacld-3.0/.../hif/src/ce/ce_main.c:2135 fait
          #   « return A_ERROR; » (A_STATUS) dans une fonction qui renvoie
          #   QDF_STATUS. En C ce sont des entiers : bloquer n'apporte rien.
          #   L'option n'existe pas dans les vieux clang et le noyau active
          #   -Werror=unknown-warning-option (Makefile:520) : on ne l'ajoute
          #   que si ce clang la connaît.
          EXTRA=""
          if clang -Werror=unknown-warning-option -Wno-implicit-enum-enum-cast \
                   -fsyntax-only -x c /dev/null >/dev/null 2>&1; then
            EXTRA="-Wno-implicit-enum-enum-cast"
          else
            echo "note: -Wimplicit-enum-enum-cast inconnu de ce clang, ignoré"
          fi

          make -j"$(nproc)" O=out ARCH=arm64 \
            $MAKE_ARGS \
            KCFLAGS="-Wno-visibility -Wno-unused-but-set-variable -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-error=strict-prototypes -Wno-fortify-source $EXTRA"

      - name: Préparer les fichiers
        run: |
          BOOT=out/arch/arm64/boot
          mkdir -p release

          # L'image qui boote est Image.gz-dtb :
          #   CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y + CONFIG_IMG_GZ_DTB=y
          #   => arch/arm64/Makefile : KBUILD_IMAGE := $(boot)/Image.gz-dtb
          #   => $(obj)/Image.gz-dtb = Image.gz + $(DTB_OBJS)
          test -f "$BOOT/Image.gz-dtb" || { echo "ERREUR: $BOOT/Image.gz-dtb introuvable"; exit 1; }
          cp "$BOOT/Image.gz-dtb" release/
          cp "$BOOT/Image.gz" release/ 2>/dev/null || true
          cp "$BOOT/Image" release/ 2>/dev/null || true

          # dtb / dtbo.img : volontairement PAS livrés.
          # Cet arbre ne génère que les dtb de la carte de référence sm6150
          # (sm6150.dtb + overlays idp/qrd/rumi) : le DTB/DTBO de mojito/sunny
          # vient du firmware stock. Et AK3 flashe déjà tout seul un dtbo.img
          # présent dans le zip (write_boot -> flash_generic dtbo), tandis que
          # flash_generic abandonne si la partition n'existe pas.
          echo "dtb générés (référence, non livrés) :"
          find "$BOOT/dts" -name '*.dtb' -printf '  %f\n' | sort

          ls -lh release

      - name: Créer le zip AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cd ak3
          rm -rf .git .github README.md

          cat > anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=NetErnels KernelSU-Next + SuSFS (sunny/mojito)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=mojito
          device.name2=sunny
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          # Image.gz-dtb uniquement : AK3 teste les noms dans cet ordre
          #   zImage zImage-dtb Image Image-dtb Image.gz Image.gz-dtb ...
          # donc un fichier "Image" dans le zip masquerait Image.gz-dtb.
          cp ../release/Image.gz-dtb .

          ZIP="sunny-NetErnels-KSUNext-susfs-clang${CLANG_VER}-$(date +%Y%m%d).zip"
          zip -r9 "../release/$ZIP" . -x "*.git*"
          cd ..

          # Garde-fous : Image.gz-dtb présent, Image absent.
          # Pas de « | grep -q » : sous « bash -eo pipefail » le lecteur ferme le
          # tube trop tôt et le producteur meurt en 141 (SIGPIPE).
          unzip -l "release/$ZIP" > /tmp/zip-list.txt
          grep -q 'Image\.gz-dtb' /tmp/zip-list.txt \
            || { echo "ERREUR: Image.gz-dtb absent du zip" >&2; exit 1; }
          if grep -qE '[[:space:]]Image$' /tmp/zip-list.txt; then
            echo "ERREUR: Image non compressé présent dans le zip" >&2
            exit 1
          fi

          rm -f release/SHA256SUMS
          ( cd release && sha256sum * > SHA256SUMS )
          ls -lh release

      - name: Envoyer l’artefact
        uses: actions/upload-artifact@v4
        with:
          name: sunny-NetErnels-KernelSU-clang${{ inputs.clang_version || '23' }}
          path: release/
          if-no-files-found: error
